name: Daten aktualisieren

# Wöchentlich in der Nacht zum Montag, wenn Overpass am wenigsten ausgelastet
# ist. Der Lauf holt nur, was seine Haltbarkeit überschritten hat — Parkplätze
# nach 30 Tagen, Wanderwege und Ziele nach 90, Orte nach 180, Postleitzahlen
# nach 365. Dadurch bleibt jeder einzelne Lauf kurz.
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:
    inputs:
      budget:
        description: "Zeitbudget für den Abruf in Minuten"
        default: "240"

permissions:
  contents: read

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    # Großzügig über dem Abrufbudget: Aufbereitung und Import brauchen danach
    # noch einige Minuten.
    timeout-minutes: 330

    # Einmal zentral: der secrets-Kontext steht in if-Bedingungen nicht zur
    # Verfügung, der env-Kontext dagegen schon.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Zuerst prüfen, sonst scheitert der Lauf erst Minuten später an einer
      # Meldung, die auf das Skript zeigt statt auf das fehlende Geheimnis.
      - name: Geheimnisse vorhanden?
        run: |
          # Bewusst mit if statt "[ … ] && …": GitHub führt diesen Block mit
          # "bash -e" aus, wo eine fehlschlagende Bedingung am Zeilenanfang den
          # Schritt abbrechen kann — ausgerechnet dann, wenn alles vorhanden ist.
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL fehlt — anzulegen unter Settings → Secrets and variables → Actions"
            exit 1
          fi
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK fehlt — der Lauf importiert die Daten, stößt aber kein Deployment an. Die Seiten übernehmen die Änderungen dann erst mit ihrer nächsten Revalidierung (bis zu sieben Tage)."
          fi
          echo "Voraussetzungen geprüft."

      - name: Abhängigkeiten installieren
        run: npm ci

      # Die Kacheln des letzten Laufs weiterverwenden — ohne sie würde jeder
      # Lauf bei null anfangen und Stunden brauchen.
      - name: Zwischenspeicher der Kacheln
        uses: actions/cache@v4
        with:
          path: data/raw
          key: osm-kacheln-${{ github.run_id }}
          restore-keys: osm-kacheln-

      # Der Zwischenspeicher ist nicht verlässlich: Beim allerersten Lauf fehlt
      # er, und GitHub verwirft ihn nach sieben Tagen ohne Zugriff — bei einem
      # Wochenlauf also regelmäßig. Ohne Kacheln bräuchte der Abruf rund neun
      # Stunden, denn jede Kachel einzeln kostet zwischen 40 und 130 Sekunden.
      # Das Archiv bringt den Grundbestand in Sekunden zurück; die
      # Zeitstempel darin entscheiden, was der Abruf danach erneuert.
      - name: Kachel-Grundbestand holen, falls nötig
        run: |
          if [ -f data/raw/_status.json ] && ! grep -q '"vollstaendig": false' data/raw/_status.json; then
            echo "Zwischenspeicher vollständig — Archiv nicht nötig."
            exit 0
          fi
          echo "Kein vollständiger Zwischenspeicher — hole den Grundbestand."
          curl -fsSL -o /tmp/kacheln.tar.gz \
            https://github.com/${{ github.repository }}/releases/download/kacheln/osm-kacheln.tar.gz
          mkdir -p data
          # -k: vorhandene Kacheln gewinnen, sie sind neuer als das Archiv.
          tar -xzkf /tmp/kacheln.tar.gz -C data 2>/dev/null || true
          echo "$(ls data/raw | wc -l) Kacheln liegen jetzt bereit."

      - name: Bewertungen sichern
        run: npm run backup

      # Vor dem Import: Wären die Bewertungen beim Import beschädigt worden,
      # läge die Sicherung bereits vor.
      - name: Sicherung ablegen
        uses: actions/upload-artifact@v4
        with:
          name: bewertungen-${{ github.run_number }}
          path: data/sicherung/*.json
          retention-days: 90
          if-no-files-found: warn

      - name: Daten abrufen
        env:
          ABRUF_BUDGET_MIN: ${{ github.event.inputs.budget || '240' }}
        run: npm run -w pipeline fetch admin pois places plz trails ziele umfeld wasserfaelle

      # Setzt die Ausgabe "vollstaendig". Steht sie auf "nein", war der Abruf
      # unvollständig; dann wird nichts aufbereitet und nichts importiert.
      # Der Lauf bleibt trotzdem grün, damit der Zwischenspeicher die bereits
      # geholten Kacheln behält und der nächste Lauf dort ansetzt.
      - name: Aufbereiten
        id: aufbereiten
        run: npm run data:build

      - name: Importieren
        if: steps.aufbereiten.outputs.vollstaendig == 'ja'
        run: npm run data:load

      - name: Bilder nachziehen
        if: steps.aufbereiten.outputs.vollstaendig == 'ja'
        run: npm run data:bilder

      - name: Hinweis unvollständiger Abruf
        if: steps.aufbereiten.outputs.vollstaendig != 'ja'
        run: |
          echo "::warning::Abruf noch nicht vollständig — nicht importiert. Die geholten Kacheln liegen im Zwischenspeicher, der nächste Lauf setzt dort an."

      # Ein Deployment holt die neuen Daten sofort auf alle Seiten. Ohne den
      # Hook geschieht dasselbe von selbst, nur verteilt über die
      # Revalidierungsfristen der Seitentypen — bis zu sieben Tage.
      - name: Neu ausliefern
        if: steps.aufbereiten.outputs.vollstaendig == 'ja' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"

      - name: Hinweis ohne Deploy Hook
        if: steps.aufbereiten.outputs.vollstaendig == 'ja' && env.VERCEL_DEPLOY_HOOK == ''
        run: echo "Kein Deploy Hook hinterlegt — die Daten sind importiert, die Seiten ziehen mit ihrer nächsten Revalidierung nach."
